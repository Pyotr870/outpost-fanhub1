name: Deploy OUTPOST to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.md'
      - '*.sql'
      - '*.js'
      - '*.webmanifest'
      - '*.svg'
      - '*.png'
      - '*.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site from repository root
        run: |
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='outpost_v08_deploy.zip' --exclude='outpost-fanhub1-main 2.zip' ./ site/
          test -f site/index.html
          test "$(wc -c < site/index.html)" -gt 150000

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
