name: Deploy OUTPOST to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'outpost_v08_deploy.zip'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/prepare-outpost.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site from v0.8 archive
        run: |
          mkdir -p unpacked site
          unzip -q outpost_v08_deploy.zip -d unpacked
          test -f unpacked/outpost_v08/index.html
          bash .github/scripts/prepare-outpost.sh unpacked/outpost_v08
          cp -R unpacked/outpost_v08/. site/
          test -f site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
