name: Promote OUTPOST v0.8 source to repository root

on:
  push:
    branches: [promote-outpost-v08]
    paths:
      - '.github/workflows/promote-archive.yml'
      - 'PROMOTE-ARCHIVE.txt'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote-outpost-v08
          fetch-depth: 0

      - name: Extract and prepare the complete v0.8 source
        run: |
          mkdir -p unpacked
          unzip -q outpost_v08_deploy.zip -d unpacked
          test -f unpacked/outpost_v08/index.html
          bash .github/scripts/prepare-outpost.sh unpacked/outpost_v08
          cp -R unpacked/outpost_v08/. .
          test -f index.html
          test "$(wc -c < index.html)" -gt 150000
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')
          stale = ('Версия 0.7', 'Version 0.7', 'OUTPOST · BUILD 0.7', 'OUTPOST · VERSION 0.7')
          assert not any(label in page for label in stale), 'stale OUTPOST version label remains'
          PY

      - name: Commit promoted source
        run: |
          rm -rf unpacked
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote complete OUTPOST v0.8 source to repository root"
          git push origin promote-outpost-v08
