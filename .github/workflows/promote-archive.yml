name: Promote OUTPOST v0.8 source to repository root

on:
  push:
    branches: [promote-outpost-v08]
    paths:
      - '.github/workflows/promote-archive.yml'
      - 'PROMOTE-ARCHIVE.txt'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote-outpost-v08
          fetch-depth: 0

      - name: Extract and prepare the complete v0.8 source
        run: |
          mkdir -p unpacked
          unzip -q outpost_v08_deploy.zip -d unpacked
          test -f unpacked/outpost_v08/index.html
          bash .github/scripts/prepare-outpost.sh unpacked/outpost_v08
          cp -R unpacked/outpost_v08/. .
          test -f index.html
          test "$(wc -c < index.html)" -gt 150000
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')
          stale = ('Версия 0.7', 'Version 0.7', 'OUTPOST · BUILD 0.7', 'OUTPOST · VERSION 0.7')
          assert not any(label in page for label in stale), 'stale OUTPOST version label remains'
          PY

      - name: Switch Pages deployment to the repository root
        run: |
          cat > .github/workflows/deploy.yml <<'YAML'
          name: Deploy OUTPOST to GitHub Pages

          on:
            push:
              branches: [main]
              paths:
                - 'index.html'
                - '*.md'
                - '*.sql'
                - '*.js'
                - '*.webmanifest'
                - '*.svg'
                - '*.png'
                - '*.html'
                - '.github/workflows/deploy.yml'
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Prepare site from repository root
                  run: |
                    mkdir -p site
                    rsync -a --exclude='.git' --exclude='.github' --exclude='outpost_v08_deploy.zip' --exclude='outpost-fanhub1-main 2.zip' ./ site/
                    test -f site/index.html
                    test "$(wc -c < site/index.html)" -gt 150000

                - name: Configure Pages
                  uses: actions/configure-pages@v5
                  with:
                    enablement: true

                - name: Upload Pages artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: site

              deploy:
                environment:
                  name: github-pages
                  url: ${{ steps.deployment.outputs.page_url }}
                runs-on: ubuntu-latest
                needs: build
                steps:
                  - name: Deploy to GitHub Pages
                    id: deployment
                    uses: actions/deploy-pages@v4
          YAML

      - name: Commit promoted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote complete OUTPOST v0.8 source to repository root"
          git push origin promote-outpost-v08
