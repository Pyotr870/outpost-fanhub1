name: Validate OUTPOST application

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-archive.yml'
      - 'index.html'
      - '*.md'
      - '*.sql'
      - '*.js'
      - '*.webmanifest'
      - '*.svg'
      - '*.png'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application HTML and local references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import sys
          source = Path("index.html").read_text(encoding="utf-8")
          if len(source.encode("utf-8")) < 150000:
              sys.exit("index.html is not the complete OUTPOST application")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs, self.ids = [], []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if "id" in a: self.ids.append(a["id"])
                  for key in ("src", "href"):
                      value = a.get(key, "")
                      if value and not value.startswith(("#","http:","https:","data:","mailto:","tel:","javascript:")):
                          self.refs.append(value.split("?",1)[0].split("#",1)[0])
          parser = Audit()
          parser.feed(source)
          missing = sorted({r for r in parser.refs if r and not (Path(".") / r).exists() and not r.startswith(("/", "//"))})
          duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
          if missing: print("Missing local references:", *missing, sep="\\n- ")
          if duplicates: print("Duplicate IDs:", *duplicates, sep="\\n- ")
          if missing or duplicates: sys.exit(1)
          print(f"HTML parsed; {len(parser.ids)} IDs and {len(parser.refs)} local references checked.")
          PY

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.I | re.S)
          failed = []
          for i, code in enumerate(scripts, 1):
              if not code.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as f:
                  f.write(code)
                  f.flush()
                  result = subprocess.run(["node", "--check", f.name], text=True, capture_output=True)
              if result.returncode:
                  failed.append((i, result.stderr))
          if failed:
              for i, err in failed:
                  print(f"Inline script #{i}\\n{err}")
              sys.exit(1)
          print(f"JavaScript syntax passed: {len(scripts)} inline script blocks.")
          PY

      - name: Audit backend security defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          sql = Path("schema.sql").read_text(encoding="utf-8").lower()
          config = Path("supabase-config.js").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")
          checks = {
              "RLS enabled for profiles": "alter table public.profiles enable row level security" in sql,
              "RLS enabled for albums": "alter table public.albums enable row level security" in sql,
              "RLS enabled for photos": "alter table public.photos enable row level security" in sql,
              "profile policy scoped to auth.uid": "using (id = auth.uid())" in sql,
              "album policy scoped to auth.uid": "owner_id = auth.uid()" in sql,
              "private storage bucket": "values ('outpost-photos', 'outpost-photos', false)" in sql,
              "no service-role key in frontend config": not re.search(r"service[_-]?role|sb_secret_", config, re.I),
              "service worker removes only its cache family": "key.startsWith('outpost-shell-')" in sw,
              "navigation-only offline fallback": "request.mode === 'navigate'" in sw,
          }
          for label, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {label}")
          if not all(checks.values()):
              sys.exit(1)
          PY