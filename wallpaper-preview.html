<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OUTPOST — Living Wallpaper</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101918;color:#f1eee5;font-family:Arial,Helvetica,sans-serif}.scene{position:relative;width:100%;height:100%;min-height:100vh;overflow:hidden;background:linear-gradient(180deg,#b17d59 0%,#596c60 47%,#192724 100%);animation:sky 32s ease-in-out infinite alternate}.sun{position:absolute;width:clamp(120px,18vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffe2ae 0,#e9a96c 50%,#e9a96c00 72%);top:12%;right:16%;filter:blur(2px);animation:sun 32s ease-in-out infinite alternate}.ridge{position:absolute;bottom:0;width:120%;left:-10%;height:48%;background:#293d36;clip-path:polygon(0 55%,12% 35%,23% 62%,37% 24%,49% 58%,63% 29%,75% 63%,88% 30%,100% 58%,100% 100%,0 100%)}.ridge.back{height:58%;background:#3d5148;opacity:.8;transform:translateY(5%);filter:blur(1px)}.blocks{position:absolute;bottom:14%;left:8%;width:42%;height:35%;display:flex;align-items:end;gap:2.5%;opacity:.8}.blocks i{display:block;flex:1;background:linear-gradient(90deg,#172321,#394640);border:1px solid #d6c6a133;height:70%;box-shadow:inset 0 0 24px #0005}.blocks i:nth-child(2){height:100%}.blocks i:nth-child(3){height:55%}.blocks i:nth-child(4){height:82%}.blocks i:nth-child(5){height:63%}.tower{position:absolute;right:15%;bottom:17%;width:9%;height:43%;border:2px solid #c7b99b55;background:linear-gradient(90deg,#1c2926,#45534a);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.tower:after{content:"";position:absolute;left:42%;top:12%;height:80%;width:12%;background:#d4a66c88;box-shadow:0 0 28px #e9b46c}.gridlines{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(transparent,black)}.grain{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(#fff 0.6px,transparent .8px);background-size:7px 7px}.label{position:absolute;left:5%;top:8%;letter-spacing:.28em;font-size:clamp(10px,1vw,16px);color:#fff9}.title{position:absolute;left:5%;bottom:10%;font-size:clamp(38px,7vw,110px);font-weight:800;letter-spacing:.08em;line-height:.9;text-shadow:0 8px 35px #0008}.title small{display:block;font-size:clamp(10px,1.2vw,18px);font-weight:400;letter-spacing:.4em;margin-top:18px;color:#e5d7bd}.scan{position:absolute;top:0;left:-20%;height:100%;width:20%;background:linear-gradient(90deg,transparent,#d8e6ce0c,transparent);transform:skewX(-18deg);animation:scan 14s linear infinite}@keyframes scan{to{left:120%}}@keyframes sun{to{transform:translate(-10vw,8vh);opacity:.72}}@keyframes sky{to{filter:hue-rotate(-18deg) brightness(.8)}}@media(max-aspect-ratio:1/1){.blocks{width:70%;height:28%;left:4%}.tower{right:8%;width:16%;height:34%}.title{bottom:12%}}
</style></head><body><div class="scene"><div class="sun"></div><div class="ridge back"></div><div class="ridge"></div><div class="blocks"><i></i><i></i><i></i><i></i><i></i></div><div class="tower"></div><div class="gridlines"></div><div class="grain"></div><div class="label">OUTPOST COMMUNITY HUB · AMBIENT DISPLAY</div><div class="title">THE SURFACE<small>EVERY RAID LEAVES A STORY</small></div><div class="scan"></div></div></body></html>
